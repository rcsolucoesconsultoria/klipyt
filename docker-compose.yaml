# Stack Coolify: Postgres + Redis + API + PWA + Portal PJ
#
# Domínios no Coolify (porta = porta do container):
#   api        → https://api.seudominio.com:3000
#   pwa        → https://app.seudominio.com       (porta 80; nginx faz proxy /api → api)
#   portal_pj  → https://lojista.seudominio.com   (porta 80)
#
# Variáveis obrigatórias: JWT_SECRET, API_PUBLIC_URL
# Recomendadas: CLIENT_URL, PORTAL_URL (CORS da API)

services:
  postgres_db:
    image: postgis/postgis:15-3.3-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klipyt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klipyt_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-klipyt_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-klipyt_admin} -d ${POSTGRES_DB:-klipyt_prod}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3000}
      DB_HOST: postgres_db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-klipyt_admin}
      DB_PASS: ${POSTGRES_PASSWORD:-klipyt_strong_password}
      DB_NAME: ${POSTGRES_DB:-klipyt_prod}
      DB_SSL: ${DB_SSL:-false}
      REDIS_URL: redis://redis_cache:6379
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PIX_GATEWAY: ${PIX_GATEWAY:-mock}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      CLIENT_URL: ${CLIENT_URL:-}
      PORTAL_URL: ${PORTAL_URL:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
    expose:
      - "3000"

  pwa:
    build:
      context: .
      dockerfile: apps/pwa/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL_PWA:-/api/v1}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  portal_pj:
    build:
      context: .
      dockerfile: packages/portal-pj/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL_PORTAL:-https://api.klipyt.com/api/v1}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
