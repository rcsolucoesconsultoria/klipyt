# Stack para produção / Coolify — sem portas publicadas no host.
# Desenvolvimento local: use também docker-compose.local.yml
#   docker compose -f docker-compose.yaml -f docker-compose.local.yml up -d

services:
  postgres_db:
    image: postgis/postgis:15-3.3-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-klipyt_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klipyt_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-klipyt_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-klipyt_admin} -d ${POSTGRES_DB:-klipyt_prod}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
